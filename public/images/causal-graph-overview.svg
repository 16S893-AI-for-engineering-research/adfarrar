<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d">
<title id="t">Evidence system for building the causal graph — overview</title>
<desc id="d">Five modules joined by files. A queue of open questions feeds extraction from papers; claims are matched to benchmarks, tested blind, summarized on a card, and decided by the human. Decisions generate graph.yaml, tagged by regime, which the separate DAG-GP model reads but never edits.</desc>

<style>
  :root{
    --bg:#ffffff; --ink:#1f2328; --muted:#57606a; --line:#8c959f; --rule:#d8dee4;
    --doc-f:#e9f1fb;  --doc-s:#3b6ea5;
    --key-f:#fff2e8;  --key-s:#c2410c;
    --log-f:#e6f4ec;  --log-s:#2b7a4b;
    --code-f:#f2eafb; --code-s:#6f42c1;
    --data-f:#f1f2f4; --data-s:#6e7781;
    --think-f:#fdeaf0;--think-s:#b02a4a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#6e7681; --rule:#30363d;
      --doc-f:#10233a;  --doc-s:#5b9bd5;
      --key-f:#3a1d0c;  --key-s:#f0883e;
      --log-f:#0d2a1a;  --log-s:#3fb950;
      --code-f:#231437; --code-s:#a371f7;
      --data-f:#161b22; --data-s:#8b949e;
      --think-f:#3a1020;--think-s:#f0637c;
    }
  }
  .bg{fill:var(--bg)}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--ink)}
  .h1{font-size:22px;font-weight:700}
  .h2{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.7px}
  .sub{font-size:12.5px;fill:var(--muted)}
  .bt{font-size:13.5px;font-weight:700}
  .btm{font-size:12px;font-weight:700}
  .bd{font-size:10.6px;fill:var(--ink)}
  .bm{font-size:10.6px;fill:var(--muted)}
  .it{font-size:9.8px;fill:var(--muted);font-style:italic}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .io{font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
  .el{font-size:9.8px;fill:var(--muted)}
  .num{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}

  .doc{fill:var(--doc-f);stroke:var(--doc-s);stroke-width:1.4}
  .key{fill:var(--key-f);stroke:var(--key-s);stroke-width:1.8}
  .log{fill:var(--log-f);stroke:var(--log-s);stroke-width:1.4}
  .code{fill:var(--code-f);stroke:var(--code-s);stroke-width:1.4}
  .data{fill:var(--data-f);stroke:var(--data-s);stroke-width:1.2;stroke-dasharray:4 3}
  .think{fill:var(--think-f);stroke:var(--think-s);stroke-width:1.4}
  .pk{fill:var(--key-s)} .pd{fill:var(--doc-s)} .pc{fill:var(--code-s)} .pt{fill:var(--think-s)}

  .edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#ah)}
  .loop{fill:none;stroke:var(--think-s);stroke-width:2.2;marker-end:url(#aht)}
  .ah{fill:var(--line)} .aht{fill:var(--think-s)}
  .rule{stroke:var(--rule);stroke-width:1}
</style>

<defs>
  <marker id="ah"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah"  d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path class="aht" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" width="1280" height="760"/>

<!-- Header -->
<text class="h1" x="40" y="38">Building the causal graph from the literature — overview</text>
<text class="sub" x="40" y="60">Five modules joined by files · a paper's claim is tested in your regimes, not taken on trust · you make every call</text>

<g transform="translate(1000,20)">
  <rect class="key" x="0" y="0" width="14" height="10" rx="2"/><text class="el" x="20" y="9">human-only</text>
  <rect class="think" x="100" y="0" width="14" height="10" rx="2"/><text class="el" x="120" y="9">agent</text>
  <rect class="code" x="0" y="18" width="14" height="10" rx="2"/><text class="el" x="20" y="27">script</text>
  <rect class="doc" x="100" y="18" width="14" height="10" rx="2"/><text class="el" x="120" y="27">file / doc</text>
</g>

<!-- ① ROLES -->
<line class="rule" x1="40" y1="78" x2="1240" y2="78"/>
<text class="h2" x="40" y="96">① ROLES</text>
<rect class="key" x="40" y="104" width="285" height="44" rx="7"/>
<text class="btm" x="54" y="122">You — Scientific Director</text>
<text class="bm" x="54" y="139">set the queue order · triage papers · decide</text>
<rect class="doc" x="345" y="104" width="285" height="44" rx="7"/>
<text class="btm" x="359" y="122">Orchestrator</text>
<text class="bm" x="359" y="139">reads STATUS.md · hands off · logs · no science calls</text>
<rect class="think" x="650" y="104" width="285" height="44" rx="7"/>
<text class="btm" x="664" y="122">Literature agent — extracts only</text>
<text class="bm" x="664" y="139">claims · delays · benchmarks, with page + quote</text>
<rect class="think" x="955" y="104" width="285" height="44" rx="7"/>
<text class="btm" x="969" y="122">Test agent — blind</text>
<text class="bm" x="969" y="139">runs fixed tests · never sees the papers</text>

<!-- ② FILES -->
<line class="rule" x1="40" y1="166" x2="1240" y2="166"/>
<text class="h2" x="40" y="184">② STANDING FILES</text>
<g>
  <rect class="doc" x="40" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="50" y="209">STATUS.md</text>
  <text class="bm" x="50" y="224">read first · where we are</text>
  <text class="bm" x="50" y="237">node-list changes · next</text>

  <rect class="doc" x="214" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="224" y="209">HANDOFF.md</text>
  <text class="bm" x="224" y="224">goal · decisions · how to run</text>

  <rect class="key" x="388" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="398" y="209">CONTEXT.md</text>
  <text class="bm" x="398" y="224">nodes · regimes · definitions</text>
  <text class="bm" x="398" y="237">pinned sources (BAMS, arXiv…)</text>

  <rect class="key" x="562" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="572" y="209">LOOP.md</text>
  <text class="bm" x="572" y="224">agent rules · stop rules</text>
  <text class="bm" x="572" y="237">decision table (set in advance)</text>

  <rect class="doc" x="736" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="746" y="209">benchmarks.yaml</text>
  <text class="bm" x="746" y="224">nodes covered · valid when</text>
  <text class="bm" x="746" y="237">candidate → vetted → in use</text>

  <rect class="log" x="910" y="192" width="162" height="52" rx="6"/>
  <text class="btm mono" x="920" y="209">TRIED.md</text>
  <text class="bm" x="920" y="224">append-only · every claim</text>
  <text class="bm" x="920" y="237">tested + outcome, pass or fail</text>

  <rect class="log" x="1084" y="192" width="156" height="52" rx="6"/>
  <text class="btm mono" x="1094" y="209">LOG.md</text>
  <text class="bm" x="1094" y="224">append-only · every run</text>
</g>

<!-- ③ PIPELINE -->
<line class="rule" x1="40" y1="262" x2="1240" y2="262"/>
<text class="h2" x="40" y="280">③ THE PIPELINE — each module takes a file in and hands a file on</text>

<!-- Queue -->
<rect class="doc" x="40" y="296" width="180" height="170" rx="8"/>
<text class="bt" x="54" y="317">Queue</text>
<text class="bd" x="54" y="336">open questions, e.g.</text>
<text class="bd mono" x="54" y="350">SST → RH : lag?</text>
<text class="bm" x="54" y="370">from: current graph</text>
<text class="bm" x="54" y="384">      node-list pairs</text>
<text class="bm" x="54" y="398">      new claims in papers</text>
<text class="bm" x="54" y="412">      missing benchmarks</text>
<text class="it" x="54" y="434">≤ 3 claims in testing</text>
<text class="it" x="54" y="447">at once · you set order</text>

<!-- Modules -->
<g>
  <rect class="think" x="250" y="296" width="180" height="170" rx="8"/>
  <circle class="pt" cx="268" cy="315" r="9"/><text class="num" x="268" y="319">1</text>
  <text class="bt" x="284" y="320">Extract</text>
  <text class="bd" x="262" y="342">read paper, pull out claims</text>
  <text class="bd" x="262" y="356">as fields: exists · sign ·</text>
  <text class="bd" x="262" y="370">lag · footprint · scope</text>
  <text class="bd" x="262" y="384">+ benchmarks it uses</text>
  <text class="it" x="262" y="402">not pinned → triage card</text>
  <text class="io" x="262" y="438">in : paper</text>
  <text class="io" x="262" y="452">out: claims.yaml</text>

  <rect class="code" x="450" y="296" width="180" height="170" rx="8"/>
  <circle class="pc" cx="468" cy="315" r="9"/><text class="num" x="468" y="319">2</text>
  <text class="bt" x="484" y="320">Plan the test</text>
  <text class="bd" x="462" y="342">count independent papers</text>
  <text class="bd" x="462" y="356">map each field → fixed test</text>
  <text class="bd" x="462" y="370">pick benchmarks that fit</text>
  <text class="bd" x="462" y="384">write the prediction first</text>
  <text class="it" x="462" y="402">checks TRIED.md first</text>
  <text class="io" x="462" y="438">in : claims.yaml</text>
  <text class="io" x="462" y="452">out: test_request.yaml</text>

  <rect class="code" x="650" y="296" width="180" height="170" rx="8"/>
  <circle class="pc" cx="668" cy="315" r="9"/><text class="num" x="668" y="319">3</text>
  <text class="bt" x="684" y="320">Test bench</text>
  <text class="bd" x="662" y="342">pass 1: matched benchmarks</text>
  <text class="bd" x="662" y="356">pass 2: fixed causal tests</text>
  <text class="bd" x="662" y="370">run once per regime</text>
  <text class="it" x="662" y="402">blind: no claimed values</text>
  <text class="io" x="662" y="438">in : test_request.yaml</text>
  <text class="io" x="662" y="452">out: result.json</text>

  <rect class="code" x="850" y="296" width="180" height="170" rx="8"/>
  <circle class="pc" cx="868" cy="315" r="9"/><text class="num" x="868" y="319">4</text>
  <text class="bt" x="884" y="320">Card</text>
  <text class="bd" x="862" y="342">papers: n independent</text>
  <text class="bd" x="862" y="356">  (≥3 good · ≥5 strong)</text>
  <text class="bd" x="862" y="370">benchmark · tests: ✓ ✗ n/a</text>
  <text class="bd" x="862" y="384">one plot · rule's verdict</text>
  <text class="it" x="862" y="402">built by script, no prose</text>
  <text class="io" x="862" y="438">in : claims + result</text>
  <text class="io" x="862" y="452">out: card.md</text>

  <rect class="key" x="1050" y="296" width="190" height="170" rx="8"/>
  <circle class="pk" cx="1068" cy="315" r="9"/><text class="num" x="1068" y="319">5</text>
  <text class="bt" x="1084" y="320">You decide</text>
  <text class="bd" x="1062" y="342">1–3 min per card:</text>
  <text class="bd" x="1062" y="356">confirm or override</text>
  <text class="bd" x="1062" y="370">the rule's verdict</text>
  <text class="bd" x="1062" y="384">(override = one-line reason)</text>
  <text class="it" x="1062" y="402">verdict per regime</text>
  <text class="io" x="1062" y="438">in : card.md</text>
  <text class="io" x="1062" y="452">out: decisions/E-xx.md</text>
</g>

<path class="edge" d="M220,350 H248"/>
<path class="edge" d="M430,381 H448"/>
<path class="edge" d="M630,381 H648"/>
<path class="edge" d="M830,381 H848"/>
<path class="edge" d="M1030,381 H1048"/>

<!-- Inputs under modules -->
<rect class="data" x="250" y="488" width="180" height="52" rx="7"/>
<text class="btm" x="262" y="506">Papers</text>
<text class="bm" x="262" y="521">targeted search per question</text>
<text class="bm" x="262" y="534">+ background alerts</text>
<path class="edge" d="M340,488 V468"/>

<rect class="data" x="650" y="488" width="180" height="52" rx="7"/>
<text class="btm" x="662" y="506">Synthetic system</text>
<text class="bm" x="662" y="521">each test proven once on</text>
<text class="bm" x="662" y="534">known answers before use</text>
<path class="edge" d="M740,488 V468"/>

<!-- Loops back to queue -->
<path class="loop" d="M260,466 V476 H232 V430 H222"/>
<text class="el" x="140" y="484">new claims</text>
<path class="loop" d="M940,466 V560 H130 V468"/>
<text class="el" x="460" y="555">conflict → deciding experiment · no benchmark → find one</text>

<!-- ④ OUTPUT -->
<line class="rule" x1="40" y1="584" x2="1240" y2="584"/>
<text class="h2" x="40" y="602">④ OUTPUT — one file leaves the system</text>

<rect class="doc" x="40" y="616" width="660" height="92" rx="8"/>
<text class="bt" x="56" y="638">Regimes</text>
<text class="bd" x="56" y="658">Each edge gets a verdict for each regime (early development · rapid intensification · neither),</text>
<text class="bd" x="56" y="673">defined in CONTEXT.md. graph.yaml tags each edge with the regimes it holds in, so</text>
<text class="bd" x="56" y="688">picking a regime gives you that regime's graph.</text>
<text class="it" x="56" y="702">Rare regimes will return more "untestable" — that is a finding, not a failure.</text>

<rect class="code" x="1050" y="616" width="190" height="92" rx="8"/>
<text class="bt mono" x="1066" y="640">graph.yaml</text>
<text class="bd" x="1066" y="660">nodes · edges · lags ·</text>
<text class="bd" x="1066" y="674">footprints · regimes</text>
<text class="it" x="1066" y="696">signed decisions only</text>
<path class="edge" d="M1145,466 V614"/>

<rect class="data" x="740" y="616" width="270" height="92" rx="8"/>
<text class="bt" x="756" y="640">DAG-GP model</text>
<text class="bd" x="756" y="660">separate · reads graph.yaml</text>
<text class="bd" x="756" y="674">never edits it</text>
<text class="it" x="756" y="696">training and inference live here</text>
<path class="edge" d="M1050,662 H1012"/>

<text class="it" x="40" y="740">Agents never supply an edge, lag, footprint, threshold, or causal conclusion. They may propose a new node, with a source, to the CONTEXT.md inbox — never remove one.</text>
</svg>
